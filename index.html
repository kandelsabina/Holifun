<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Holi 🌸</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  overflow:hidden;
  text-align:center;
  background: linear-gradient(-45deg,#ff416c,#ff4b2b,#ffcc70,#24c6dc,#a18cd1);
  background-size:600% 600%;
  animation:gradient 10s ease infinite;
  color:white;
}

@keyframes gradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.container{
  position:relative;
  z-index:10;
  top:25vh;
  padding:20px;
}

h1{
  font-size:clamp(30px,6vw,60px);
  text-shadow:0 0 20px yellow;
}

p{
  font-size:clamp(16px,3vw,22px);
  margin-top:15px;
}

/* Yes / No buttons */
.button-group button{
  margin:15px;
  padding:14px 25px;
  border:none;
  border-radius:30px;
  background:#ff0080;
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

.button-group button:hover{
  transform:scale(1.1);
  background:#8000ff;
}

/* Floating Splash Images */
.splash{
  position:absolute;
  width:200px;
  opacity:0.85;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  from{transform:translateY(110vh);}
  to{transform:translateY(-20vh);}
}

/* Popup */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  background:white;
  color:#ff4081;
  padding:30px;
  border-radius:25px;
  display:none;
  z-index:20;
  box-shadow:0 0 50px hotpink;
  text-align:center;
  overflow:hidden;
  animation:popupShow 0.8s forwards;
}

@keyframes popupShow {
  0% {transform:translate(-50%, -50%) scale(0);}
  60% {transform:translate(-50%, -50%) scale(1.1);}
  100% {transform:translate(-50%, -50%) scale(1);}
}

/* Rainbow animated title */
@keyframes rainbowText {
  0% {color: #ff0000;}
  15% {color: #ff7f00;}
  30% {color: #ffff00;}
  45% {color: #00ff00;}
  60% {color: #0000ff;}
  75% {color: #4b0082;}
  90% {color: #8b00ff;}
  100% {color: #ff0000;}
}

.popup h2{
  font-size:2rem;
  animation: rainbowText 3s infinite;
}

/* Floating emoji confetti inside popup */
.emoji {
  position: absolute;
  font-size: 24px;
  animation: floatEmoji linear forwards;
}

@keyframes floatEmoji {
  0% {opacity:1; transform: translateY(0) rotate(0deg);}
  100% {opacity:0; transform: translateY(-200px) rotate(360deg);}
}

.popup button{
  background:#ff4081;
  margin-top:15px;
  padding:12px 25px;
  border:none;
  border-radius:20px;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

.popup button:hover{
  transform:scale(1.1);
  background:#8000ff;
}
</style>
</head>

<body>

<!-- SoundCloud Player Embed (Hidden) -->
<iframe 
  id="soundcloudPlayer"
  width="0" 
  height="0" 
  scrolling="no" 
  frameborder="no" 
  allow="autoplay"
  src="">
</iframe>

<div class="container" id="mainContainer">
  <h1>🌈 Happy Holi 💖</h1>
  <p>Do you want to get colors from me? 🎨✨</p>
  <div class="button-group">
    <button id="yesBtn">Yes! 😍</button>
    <button id="noBtn">No 😅</button>
  </div>
</div>

<div class="popup" id="popup">
  <h2>💌 I knew you wanted it! 💖</h2>
  <p>
    Happy Holi! 🌸🌈💃<br>
    May your life be filled with love ❤️, laughter 😂, and colors everywhere 🌈🎨✨<br>
    Enjoy every splash of joy and every beautiful moment 💖💫
  </p>
  <button onclick="closePopup()">Close</button>
</div>

<script>
// SoundCloud Track URL
const trackURL = "https://soundcloud.com/rida-mansoor/balam-pichkari-yeh-jawani-hai?in=shristi-singh-569773335/sets/holi-songs&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing";

// REAL Holi Splash PNGs
const splashImages = [
"https://images.unsplash.com/photo-1603228254119-e6a4d095dc59?q=80&w=871",
"https://images.unsplash.com/photo-1610313898425-a5c637a940db?q=80&w=394",
"https://plus.unsplash.com/premium_photo-1664304095595-e428558e8161?q=80&w=870",
"https://plus.unsplash.com/premium_photo-1682089821031-05d132d2be0e?q=80&w=870",
"https://images.unsplash.com/photo-1551757891-24a8dabd2708?q=80&w=870",
"https://images.unsplash.com/photo-1527075240784-552cddfbb143?q=80&w=876",
"https://images.unsplash.com/photo-1503875154399-95d2b151e3b0?q=80&w=387"
];

// Create floating splashes
for(let i=0;i<8;i++){
  let img=document.createElement("img");
  img.src=splashImages[Math.floor(Math.random()*splashImages.length)];
  img.classList.add("splash");
  img.style.left=Math.random()*100+"vw";
  img.style.animationDuration=(8+Math.random()*6)+"s";
  document.body.appendChild(img);
}

// NO button dodging effect
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseover", function(){
  const container = document.getElementById("mainContainer");
  const maxX = container.offsetWidth - noBtn.offsetWidth;
  const maxY = container.offsetHeight - noBtn.offsetHeight;
  noBtn.style.position = "relative";
  noBtn.style.left = Math.random() * maxX - noBtn.offsetLeft + "px";
  noBtn.style.top = Math.random() * maxY - noBtn.offsetTop + "px";
});

// YES button click
document.getElementById("yesBtn").addEventListener("click", startCelebration);

function startCelebration(){
  // Play SoundCloud
  document.getElementById("soundcloudPlayer").src = 
    "https://w.soundcloud.com/player/?url=" + trackURL + "&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false";

  // Hide initial container
  document.getElementById("mainContainer").style.display = "none";

  // Show popup
  const popup = document.getElementById("popup");
  popup.style.display = "block";
  popup.style.transform = "translate(-50%, -50%) scale(0)";
  setTimeout(()=>popup.style.transform = "translate(-50%, -50%) scale(1)", 50);

  // Floating emojis inside popup
  const emojis = ["🌸","🌈","💖","🎨","💃","✨","😍"];
  for(let i=0;i<15;i++){
    const e = document.createElement("div");
    e.classList.add("emoji");
    e.innerText = emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left = Math.random()*80 + 10 + "%";
    e.style.top = Math.random()*80 + 10 + "%";
    e.style.fontSize = Math.random()*24 + 16 + "px";
    e.style.animationDuration = (2+Math.random()*3) + "s";
    popup.appendChild(e);
    setTimeout(()=> e.remove(),4000);
  }

  // Color Explosion
  for(let i=0;i<100;i++){
    let color=document.createElement("div");
    color.style.position="fixed";
    color.style.width="15px";
    color.style.height="15px";
    color.style.borderRadius="50%";
    color.style.left="50%";
    color.style.top="50%";
    color.style.background=`hsl(${Math.random()*360},100%,50%)`;
    color.style.transition="1s";
    document.body.appendChild(color);

    setTimeout(()=>{
      color.style.transform=`translate(${(Math.random()-0.5)*800}px, ${(Math.random()-0.5)*800}px)`;
      color.style.opacity="0";
    },10);

    setTimeout(()=>color.remove(),1200);
  }
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}
</script>

</body>
</html>
